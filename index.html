
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camera Demo</title>
</head>
<body>
  <h2>Camera Permission Demo</h2>
  <p>Camera shuru karne ke liye button dabao. Video isi device par dikhega.</p>

  <button id="start">Start Camera</button>
  <button id="stop">Stop Camera</button>
  <p id="status">Camera band hai.</p>
  <video id="video" autoplay playsinline muted width="320"></video>

  <script>
    let stream = null;

    document.getElementById("start").onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });
        document.getElementById("video").srcObject = stream;
        document.getElementById("status").textContent =
          "Camera chalu hai. Video isi device par dikh raha hai.";
      } catch (error) {
        document.getElementById("status").textContent =
          "Camera nahi khula: " + error.name;
      }
    };

    document.getElementById("stop").onclick = () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }
      document.getElementById("video").srcObject = null;
      document.getElementById("status").textContent = "Camera band hai.";
    };
  </script>
</body>
</html>
